<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>ADD preview login</title>
    <style>
        body { font-family: sans-serif; margin: 3rem; }
        label, input, button { display: block; margin: .5rem 0; }
        input { padding: .4rem; width: 18rem; }
        button { padding: .5rem 1rem; }
    </style>
</head>
<body>
<h1>ADD preview login</h1>
<p>Local preview only. Credentials are seeded in the preview <code>add_user</code> database.</p>
<form method="post" action="/index.php/auth/login">
    <label>Username <input name="identity" value="admin" autocomplete="username"></label>
    <label>Password <input name="password" type="password" value="PreviewAdmin123" autocomplete="current-password"></label>
    <button type="submit">Sign in</button>
</form>
</body>
</html>
