alias=copd
namespace="COPD\Main"
hometools=COPDVisits
javascript=js/copd.js
javascript_weight=1002

[copd]
components=Encounter_Domain_ManualEnrol
encounter=copd
title=COPD
create-label=Add to COPD
create-set=visit
redirect=demogadm

[visit]
title=Visit
description=Visit
encounter=copd-visit
components = Encounter_RepeatSection ConditionalTopSection
parent=copd
show_pattern="Visit {section_no} ({demogadm.date_seen})"
empty_pattern_part="no date"
label=visit

[demogadm]
title=Visit details
components=Content_EncounterEntry COPDVisitsButton
form=copd-demogadm.ftx
encounter=copd-visit-admission
parent=visit
ConditionalTopMenu.always_show=1

[comorbs]
title=Comorbidities
components=Content_EncounterEntry
form=copd-comorbs.ftx
encounter=copd-comorb-record
parent=visit
ConditionalTopMenu.always_show=1
resources = CopdResource
namespace = COPD\Main

[drecord]
title=Medication
components=Content_EncounterEntry
form=common-drugs.ftx
encounter=copd-drug-record
parent=visit
ConditionalTopMenu.always_show=1

[ventresults]
title=Results
components=Content_EncounterEntry
form=copd-ventresults.ftx
encounter=copd-visit-ventresults
parent=visit
ConditionalTopMenu.always_show=1

[revbundle]
title=Review and bundle
components=Content_EncounterEntry
form=copd-revbundle.ftx
encounter=copd-visit-revbundle
parent=visit
ConditionalTopMenu.always_show=1

[qol]
title=Quality of Life
description=Quality of Life surveys
form=copd-qol.ftx
parent=visit
components = Content_EncounterSummary
encounter=copd-visit-qol

[calllist]
title=Phone calls
description=Phone calls
form=copd-phonecall-list.ftx
parent=visit
components = Content_SummaryPage
icon=icon-list

[discharge]
title=Discharge
components=Content_EncounterEntry
form=copd-discharge.ftx
encounter=copd-visit-discharge
parent=visit
ConditionalTopMenu.always_show=1

[phonecall]
title=Phone call
components = Encounter_Modal Form_DB RequiredFields_Validate
form=copd-phonecall.ftx
encounter=copd-visit-call
parent=visit
LookupDictGroupItems.dictionary=copd_phone_outcome
LookupDictGroupItems.output_field=call_outcome
LookupDictGroupItems.lookup_field=call_type
LookupDictGroupItems.empty_option=- choose outcome -
ConditionalTopMenu.never_show=1

[spiro]
title="Spirometry"
form=copd-spiro.ftx
parent=resphy:exam
multi_page=resphy:test
detail_page=resphy:detail
single=test
components=Form_File MultiEncounterCreate RequiredFields_Validate

[vhads]
title=HADS
components = Content_EncounterEntry SummaryUpdate
description=HADS survey
parent=visit
encounter=qol-hads
summary_encounter=copd-visit-qol
summary-section=qol
SummaryUpdate.hads_date = hads_date
SummaryUpdate.hads_anxiety_score = hads_anxiety_score
SummaryUpdate.hads_depression_score = hads_depression_score
SummaryUpdate.hads_anxiety_mean = hads_anxiety_mean
SummaryUpdate.hads_depression_mean = hads_depression_mean
SummaryUpdate.hads_total = hads_total
SummaryUpdate.hads_status = hads_status
ConditionalTopMenu.never_show=1
no-menu=1

[vcat]
title=CAT
components = Content_EncounterEntry SummaryUpdate
description=CAT survey
parent=visit
encounter=qol-cat
summary_encounter=copd-visit-qol
summary-section=qol
ConditionalTopMenu.never_show=1
SummaryUpdate.cat_date = cat_date
SummaryUpdate.cat_status = cat_status
SummaryUpdate.cat_score = cat_score
no-menu=1

[vprisma]
title="PRISMA 7 (frailty) score"
components=Content_EncounterEntry SummaryUpdate
form=qol-prisma.ftx
encounter=qol-prisma
parent=visit
summary_encounter=copd-visit-qol
summary-section=qol
ConditionalTopMenu.never_show=1
SummaryUpdate.prisma_date = prisma_date
SummaryUpdate.prisma_status = prisma_status
SummaryUpdate.prisma_score = prisma_score
no-menu=1

[ppatients]
page_class=PRReferralsData

[prrefs]
title=PR referrals
components=PRReferrals

[cpatients]
page_class=COPDVisitData

[visits]
title=COPD visits
components=COPDVisits