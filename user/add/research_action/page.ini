requires=">=2.1.0"

[studyenrol]
encounter=res-action-studyenrol
form=act-enrol
form_ext=ftx
update_status[]=completed:enrolled
update_status[]=scheduled:awaiting enrolment
auto_add_action=1
study_date_to_use=enrol_date

[failcrit]
encounter=res-action-failcrit
form=act-enrol
form_ext=ftx
update_status[]=completed:fails to meet study criteria
auto_add_action=1
study_date_to_use=end_date

[sendpis]
encounter=res-action-sendpis
form=act-sendpis
form_ext=ftx
update_status=completed:awaiting enrolment

[consent]
encounter=res-action-consent
form=act-consent
form_ext=ftx

[contactpat]
encounter=res-action-contactpat
form=act-contact
form_ext=ftx

[notinter]
encounter=res-action-notinter
form=act-notinter
form_ext=ftx
update_status=completed:not interested
update_end_date=1
auto_add_action=1
study_date_to_use=end_date


[withdraw]
encounter=res-action-withdraw
form=act-notinter
form_ext=ftx
update_status=completed:withdrawn
update_end_date=1
auto_add_action=1
study_date_to_use=end_date

[fupnorep]
encounter=res-action-fupnorep
form=act-fupnorep
form_ext=ftx

[studycomp]
encounter=res-action-studycomp
form=act-studycomp
form_ext=ftx
update_status=completed:study complete
update_end_date=1
auto_add_action=1
study_date_to_use=end_date

