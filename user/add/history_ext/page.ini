requires=">=2.1.0"
extends=history
javascript=sepdate.js

[condition]
title=Overall condition/disease
parent=history
components = Encounter_Section
encounter=history-condition
label=overall condition/disease
redirect=summary

[summary]
title=Condition summary
parent=condition
components = Content_EncounterEntry
encounter=history-condition-summary
form=cond-summary
form_ext=csv

[visit]
label=medical history
title=Medical history
parent=history
components = Encounter_RepeatSection CopyActiveComorb
encounter=history-visit
single=episode

[comorb]
label=Diagnoses
title=Diagnoses
single=comorbidity
parent=visit
components = Content_SummaryPage
form=comorb-list.ftx

[comorbrecord]
label=Comorbidities
title=Comorbidities
single=comorbidity
parent=visit
components = Encounter_Modal Form_DB RequiredFields_Validate
form=visit-comorb.csv
encounter=history-visit-comorb
LookupDictGroupItems.dictionary=icd10
LookupDictGroupItems.output_field=comorbidity_details
LookupDictGroupItems.lookup_field=comorbidity_icd10
LookupDictGroupItems.empty_option=- choose optional details -

[other]
label=Other history
title=Other history
parent=history
components = Encounter_Section
encounter=history-other
redirect=smoking

[smlist]
title=Smoking history
parent=other
components = Content_SummaryPage
form=other-smlist.ftx
icon=icon-list

[smoking]
label=Smoking history
title=Smoking history item
single=smoking item
parent=other
components = Encounter_Modal Form_DB RequiredFields_Validate
form=smoke-record
encounter=history-other-smoke

[shcollate]
title=Collated smoking history
collate_file=smokinghistory.json
form=smoke-record
components=Form_File
