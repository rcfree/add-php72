title=Complex COPD
version=2.2.0
date=27/08/2014
requires=">=2.0.5"
uses=qol >1.0.1,med,concept

[advcopd]
title=Complex COPD
label=Complex COPD
create-label=Add patient to complex COPD
encounter=advcopd
components = Encounter_Domain_ManualEnrol
add_message="Patient added to complex COPD clinic. &lt;br/&gt;Please use the options on the left to add an annual assessment or followup assessment"
redirect=prelim

[baseline]
title=Baseline
description=Baseline
encounter=advcopd-base
components=Encounter_Section
parent=advcopd
label=baseline
redirect=prelim

[prelim]
title=Referral
PrelimRecord.title=Preliminary
description=Referal
encounter=advcopd-prelim
components = Content_EncounterEntry CheckPrelim Verification
form=prelim-referral
parent=baseline

[annual]
title=Annual assessment
description=Annual assessment
label=annual assessment
encounter=advcopd-annual
components = Encounter_RepeatSection
parent=advcopd
show_field=generic.assessment_date
ignore-samedate=1

[generic]
title=Generic info
description=Generic information
encounter=advcopd-annual-generic
components = TopMenu Content_EncounterEntry Verification
parent=annual
form=annual-generic
form_ext=csv

[exercise]
title=Exercise/breathlessness
encounter=advcopd-annual-exerprob
components = TopMenu Content_EncounterEntry PredictedQmvc Verification
parent=annual
form=annual-exercise
LungFunction.pred_fev1=exp_pred_fev1
LungFunction.pred_fvc=exp_pred_fvc
LungFunction.pred_fev1_fvc=exp_pred_fev1_fvc
