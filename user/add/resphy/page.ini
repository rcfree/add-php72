requires=">=2.1.0"
uses=client,concept
title=Respiratory Physiology
namespace=ADD\Resphy

[resphy]
title=Respiratory Physiology
label=Respiratory Physiology
components=Encounter_Domain_AutoEnrol
encounter=resphy

[exam]
title=Examinations
description=Examinations
encounter=resphy-exam
components=Encounter_ModalRepeatSection
parent=resphy
label=examination
add_text=Add new exam
empty_option=-- choose type --
show_pattern="{detail.exam_date} - {detail.test_set_details}"
use_children=1
refresh="exam;lung_function;resphy-domain-menu"
modal_width=700
modal_height=600
		
[detail]
title=Exam details
parent=exam
form=exam-detail.ftx
components=Content_EncounterSummary AccessControl OptionContainer DeleteSectionButton
encounter=resphy-exam-detail
AccessControl.permissions=view move edit delete
exclude_from_list=1

[stdlfunction]
title="Standard PFTs (ERS)"
form=resphys-exam-stdlfunction.ftx
parent=exam
multi_page=resphy:test
detail_page=resphy:detail
single=test
components=Form_File MultiEncounterCreate RequiredFields_Validate LungFunction
LungFunction.height_page=stdlfunction
LungFunction.height_field=height
