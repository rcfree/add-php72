requires=">=2.1.0"
title=Research
use=query
menu_refreshable=1
resources = Research
namespace = ADD\Research
[research]
title=Research
label=Research
create-label=Recruit patient to respiratory research
create-set=contact
encounter=res
components = Encounter_Domain_ResearchManualEnrol
version=1.0
date=17 May 2013
redirect=details

[prelim]
title=Request for consent
components=Encounter_PrelimSection
parent=research

[sent]
title=Record of consent request
components=Content_PrelimEntry
form=prelim-dbrequest
form_ext=csv
encounter=res-dbrequest
parent=prelim

[contact]
title=Database consent
description=Consent details
encounter=res-contact
components = Encounter_Section
parent=research
label=contact details

[details]
title=Consent details
components=Content_EncounterEntry CheckUnique CheckDeceased PatientPhone
form=contact-details
encounter=res-contact-details
form_ext=ftx
parent=contact
no-locking=1
no-verification=1

[general]
title=Database consent
description=Database consent
encounter=res-general
components = Encounter_DbConsentRepeatSection
parent=research
label=database consent
show_field=consent.consent_form_date

[consent]
title=Consent form
description=Consent form
form=general-consent
components = Encounter_Modal Form_DB RequiredFields_Validate UpdateStatus
parent=general
encounter=res-general-consent

[barcodes]
title=Print barcodes
description=Print barcodes
form=print-barcodes.ftx
components=PrintBarcodes UserMenuOption
UserMenuOption.heading=Research
UserMenuOption.icon=icon-print

[status]
title=Change status
description=Change status
form=contact-status.ftx
components=Encounter_Modal Form_DB RequiredFields_Validate RecruitStatus
encounter=res-contact-status
parent=contact

[review]
title=Patient review
components=Encounter_Modal Form_File RequiredFields_Validate
encounter=res-contact-status
parent=contact
form=contact-review.ftx

[commrecord]
title=Continued communication
components=Encounter_Modal Form_File RequiredFields_Validate
encounter=res-contact-status
parent=contact
form=comm-record.ftx

[comment]
title=Comment
components=Encounter_Modal Form_File RequiredFields_Validate
encounter=res-contact-status
parent=contact
form=contact-comment.ftx

[sendemail]
title=Send email
components=SendEmailHandler Form_File RequiredFields_Validate
encounter=res-contact-status
parent=contact
form=send-email.ftx

[barcode-output]
components=LabelOutput